<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Tooltip for Navigation</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <nav>
            <ul>
                <li>
                    <a href="#">Home</a>
                </li>
                <li class="nav-item-with-tooltip projects">
                    <a href="#">Projects</a>
                    <div class="tooltip-container" aria-label="Here is everything I have built">
                        <div class="tooltip">
                            <span>Here is everything I have built</span>
                        </div>
                        <div class="arrow-down"></div>
                    </div>
                </li>
                <li>
                    <a href="#">Blog</a>
                </li>
            </ul>
        </nav>
    </body>
</html>
